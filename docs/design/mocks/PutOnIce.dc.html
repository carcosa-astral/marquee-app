<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Put on ice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#232831}
button,input,textarea{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #88C0D0;outline-offset:2px}
</style>
</helmet>
<div style="width:1440px;height:900px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:#232831;color:#E5E9F0;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:14px;line-height:1.4;overflow:hidden">

  <section aria-label="Put on ice" style="width:640px;box-sizing:border-box;border-radius:18px;background:#2E3440;border:1px solid #4C566A;box-shadow:0 30px 80px rgba(0,0,0,0.5);padding:26px 28px;display:flex;flex-direction:column;gap:20px">

    <div style="display:flex;align-items:center;gap:16px">
      <div style="width:44px;height:64px;flex-shrink:0;border-radius:5px;background:linear-gradient(160deg,#8FBCBB 0%,#5E81AC 55%,#2E3440 100%)"></div>
      <div style="flex-grow:1;display:flex;flex-direction:column">
        <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#81A1C1">Put on ice</span>
        <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.01em;color:#ECEFF4">Frieren: Beyond Journey's End</span>
      </div>
    </div>

    <!-- Paused or dropped -->
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:12px;font-weight:600;color:#B8C2D4">What kind of break is this?</span>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
        <button type="button" style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 16px;border-radius:12px;border:2px solid #81A1C1;background:rgba(129,161,193,0.12);color:#ECEFF4;text-align:left;cursor:pointer">
          <span style="font-weight:600;font-size:15px;color:#81A1C1">Paused</span>
          <span style="font-size:13px;color:#B8C2D4">I plan to come back to it.</span>
        </button>
        <button type="button" style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 16px;border-radius:12px;border:1px solid #4C566A;background:transparent;color:#ECEFF4;text-align:left;cursor:pointer">
          <span style="font-weight:600;font-size:15px;color:#D08770">Dropped</span>
          <span style="font-size:13px;color:#B8C2D4">I gave up on it for now.</span>
        </button>
      </div>
    </div>

    <!-- Where you stopped -->
    <div style="display:flex;gap:16px">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
        <label for="where" style="font-size:12px;font-weight:600;color:#B8C2D4">Where you stopped</label>
        <input id="where" type="text" value="Season 1, after episode 17" style="height:40px;box-sizing:border-box;padding:0 12px;border-radius:8px;border:1px solid #4C566A;background:#3B4252;color:#ECEFF4;font-size:14px">
        <span style="font-size:12px;color:#98A3B8">Filled in from your progress. 17 of 28 watched.</span>
      </div>
      <div style="width:190px;display:flex;flex-direction:column;gap:6px">
        <label for="when" style="font-size:12px;font-weight:600;color:#B8C2D4">Date</label>
        <input id="when" type="text" value="Oct 24, 2026" style="height:40px;box-sizing:border-box;padding:0 12px;border-radius:8px;border:1px solid #4C566A;background:#3B4252;color:#ECEFF4;font-size:14px">
      </div>
    </div>

    <!-- Reason -->
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:12px;font-weight:600;color:#B8C2D4">Why <span style="font-weight:400;color:#98A3B8">(optional)</span></span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button type="button" style="height:32px;padding:0 12px;border-radius:999px;border:0;background:#5E81AC;color:#ECEFF4;font-weight:600;font-size:13px;cursor:pointer">Needed a break</button>
        <button type="button" style="height:32px;padding:0 12px;border-radius:999px;border:1px solid #4C566A;background:transparent;color:#D8DEE9;font-size:13px;cursor:pointer">Lost interest</button>
        <button type="button" style="height:32px;padding:0 12px;border-radius:999px;border:1px solid #4C566A;background:transparent;color:#D8DEE9;font-size:13px;cursor:pointer">Too slow</button>
        <button type="button" style="height:32px;padding:0 12px;border-radius:999px;border:1px solid #4C566A;background:transparent;color:#D8DEE9;font-size:13px;cursor:pointer">Too much filler</button>
        <button type="button" style="height:32px;padding:0 12px;border-radius:999px;border:1px solid #4C566A;background:transparent;color:#D8DEE9;font-size:13px;cursor:pointer">Waiting for a new season</button>
        <button type="button" style="height:32px;padding:0 12px;border-radius:999px;border:1px dashed #4C566A;background:transparent;color:#B8C2D4;font-size:13px;cursor:pointer">Add your own</button>
      </div>
      <label for="why" style="font-size:12px;font-weight:600;color:#B8C2D4;margin-top:4px">Note</label>
      <textarea id="why" rows="2" style="resize:none;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid #4C566A;background:#3B4252;color:#ECEFF4;font-size:14px;line-height:1.4">Want to finish it in one go over a long weekend.</textarea>
    </div>

    <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:#3B4252">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#81A1C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"></path></svg>
      <span style="font-size:13px;color:#D8DEE9">It leaves Watching and appears on the On Ice page. Your 17 watched episodes stay in your diary.</span>
    </div>

    <div style="display:flex;justify-content:flex-end;gap:10px">
      <button type="button" style="height:42px;padding:0 20px;border-radius:10px;border:1px solid #4C566A;background:transparent;color:#E5E9F0;font-weight:500;font-size:14px;cursor:pointer">Cancel</button>
      <button type="button" style="height:42px;padding:0 22px;border-radius:10px;border:0;background:#81A1C1;color:#2E3440;font-weight:600;font-size:14px;cursor:pointer">Put on ice</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
