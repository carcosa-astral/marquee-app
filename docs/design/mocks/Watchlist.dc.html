<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watchlist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#2E3440}
button,a{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #88C0D0;outline-offset:2px}
</style>
</helmet>
<div style="width:1440px;height:1240px;box-sizing:border-box;display:flex;background:#2E3440;color:#E5E9F0;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums;overflow:hidden">
  <div style="width:232px;flex-shrink:0"><dc-import name="Sidebar" active="Watchlist" h="1240" hint-size="232px,1240px"></dc-import></div>
  <main style="flex-grow:1;min-width:0;display:flex;flex-direction:column">
    <div style="width:1208px;height:72px;flex-shrink:0"><dc-import name="Topbar" hint-size="1208px,72px"></dc-import></div>

    <div style="padding:28px 32px 32px;display:flex;flex-direction:column;gap:26px">

      <div style="display:flex;align-items:flex-end;gap:20px">
        <div style="display:flex;flex-direction:column;gap:4px">
          <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#98A3B8">38 titles</span>
          <h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:40px;line-height:1;letter-spacing:-0.02em;color:#ECEFF4">Watchlist</h1>
        </div>
        <div style="flex-grow:1"></div>
        <button type="button" style="display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:1px solid #88C0D0;border-radius:10px;background:rgba(136,192,208,0.12);color:#88C0D0;font-weight:600;font-size:14px;cursor:pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#88C0D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg>
          Pick something for me
        </button>
      </div>

      <!-- Coming soon -->
      <section aria-label="Coming soon" style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:baseline;gap:12px">
          <h2 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px">Coming soon</h2>
          <span style="font-size:13px;color:#98A3B8">3 with a release date, 1 unconfirmed. These move to "Out now" on their own.</span>
        </div>
        <div style="border-radius:14px;border:1px solid #434C5E;background:#343A47;display:flex;flex-direction:column">
          <sc-for list="{{soon}}" as="s" hint-placeholder-count="4">
            <div style="display:flex;align-items:center;gap:16px;height:68px;padding:0 18px;border-top:{{s.bt}}">
              <div style="width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:5px 0;border-radius:8px;background:#2E3440;border:1px solid #434C5E">
                <span style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:#88C0D0">{{s.mo}}</span>
                <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;line-height:1.1;color:#ECEFF4">{{s.day}}</span>
              </div>
              <div style="width:34px;height:50px;flex-shrink:0;border-radius:4px;background:{{s.bg}}"></div>
              <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column">
                <span style="font-weight:600;color:#ECEFF4;font-size:15px">{{s.t}}</span>
                <span style="font-size:12px;color:#98A3B8">{{s.m}}</span>
              </div>
              <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:{{s.kbg}};color:{{s.kfg}}">{{s.k}}</span>
              <span style="width:110px;text-align:right;font-size:13px;color:{{s.cc}}">{{s.in}}</span>
              <button type="button" style="height:32px;padding:0 12px;border:1px solid #4C566A;border-radius:8px;background:transparent;color:#D8DEE9;font-size:12px;cursor:pointer">Remove</button>
            </div>
          </sc-for>
        </div>
      </section>

      <!-- Out now -->
      <section aria-label="Out now" style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:center;gap:16px">
          <h2 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px">Out now, not yet seen</h2>
          <div style="display:flex;gap:6px">
            <button type="button" style="height:28px;padding:0 12px;border-radius:999px;border:0;background:#4C566A;color:#ECEFF4;font-size:12px;font-weight:600;cursor:pointer">All</button>
            <button type="button" style="height:28px;padding:0 12px;border-radius:999px;border:1px solid #434C5E;background:transparent;color:#B8C2D4;font-size:12px;cursor:pointer">Movies</button>
            <button type="button" style="height:28px;padding:0 12px;border-radius:999px;border:1px solid #434C5E;background:transparent;color:#B8C2D4;font-size:12px;cursor:pointer">TV</button>
            <button type="button" style="height:28px;padding:0 12px;border-radius:999px;border:1px solid #434C5E;background:transparent;color:#B8C2D4;font-size:12px;cursor:pointer">Anime</button>
            <button type="button" style="height:28px;padding:0 12px;border-radius:999px;border:1px solid #434C5E;background:transparent;color:#B8C2D4;font-size:12px;cursor:pointer">Under 2 hours</button>
          </div>
          <div style="flex-grow:1"></div>
          <span style="font-size:13px;color:#98A3B8">Sorted by date added</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px 16px">
          <sc-for list="{{out}}" as="o" hint-placeholder-count="12">
            <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
              <div style="aspect-ratio:2/3;border-radius:8px;background:{{o.bg}};display:flex;align-items:flex-end;padding:12px;box-sizing:border-box;box-shadow:0 6px 18px rgba(0,0,0,0.28)">
                <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15px;line-height:1.12;color:#ECEFF4">{{o.t}}</span>
              </div>
              <span style="font-size:13px;font-weight:600;color:#ECEFF4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{o.t}}</span>
              <span style="font-size:12px;color:#98A3B8;margin-top:-4px">{{o.m}}</span>
              <span style="font-size:12px;color:#A9B3C5;margin-top:-4px">{{o.added}}</span>
            </div>
          </sc-for>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const grad = (a) => 'linear-gradient(160deg,' + a + ' 0%,#2E3440 100%)';
    const K = {
      Movie: { kbg: 'rgba(129,161,193,0.18)', kfg: '#81A1C1' },
      TV: { kbg: 'rgba(180,142,173,0.2)', kfg: '#B48EAD' },
      Anime: { kbg: 'rgba(235,203,139,0.16)', kfg: '#EBCB8B' }
    };
    const S = (mo, day, t, m, k, col, inn, cc, first) => ({ mo, day, t, m, k, ...K[k], bg: grad(col), in: inn, cc, bt: first ? '0' : '1px solid #434C5E' });
    const soon = [
      S('Nov', '14', 'The Salt Meridian', 'Theatrical release', 'Movie', '#81A1C1', 'in 21 days', '#A3BE8C', true),
      S('Dec', '2', 'Lanternfall, Season 2', 'Streaming premiere', 'TV', '#B48EAD', 'in 39 days', '#A3BE8C', false),
      S('Jan', '9', 'Kori no Machi', 'Theatrical release in Japan', 'Anime', '#EBCB8B', 'in 77 days', '#A3BE8C', false),
      S('TBA', '?', 'Untitled space opera', 'Release date not announced', 'Movie', '#4C566A', 'Date unconfirmed', '#98A3B8', false)
    ];
    const O = (t, m, added, col) => ({ t, m, added, bg: grad(col) });
    const out = [
      O('Chungking Express', '1994 · Movie · 102 min', 'Added Sep 30', '#88C0D0'),
      O('Ghost in the Shell', '1995 · Anime film · 83 min', 'Added Sep 12', '#B48EAD'),
      O('Twin Peaks', '1990 · TV · 2 seasons', 'Added Aug 21', '#BF616A'),
      O('Millennium Actress', '2001 · Anime film · 87 min', 'Added Aug 9', '#EBCB8B'),
      O('Yi Yi', '2000 · Movie · 173 min', 'Added Jul 30', '#A3BE8C'),
      O('Princess Mononoke', '1997 · Anime film · 134 min', 'Added Jul 18', '#8FBCBB'),
      O('The Conversation', '1974 · Movie · 113 min', 'Added Jul 2', '#81A1C1'),
      O('Cure', '1997 · Movie · 111 min', 'Added Jun 21', '#D08770'),
      O('Paris, Texas', '1984 · Movie · 145 min', 'Added Jun 5', '#5E81AC'),
      O('Ping Pong the Animation', '2014 · Anime · 11 eps', 'Added May 27', '#A3BE8C'),
      O('Mulholland Drive', '2001 · Movie · 147 min', 'Added May 14', '#B48EAD'),
      O('Tampopo', '1985 · Movie · 114 min', 'Added Apr 30', '#EBCB8B')
    ];
    return { soon, out };
  }
}
</script>
</body>
</html>
