<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#272C36}
a:focus-visible{outline:2px solid #88C0D0;outline-offset:2px}
</style>
</helmet>
<aside style="width:232px;height:{{hpx}};box-sizing:border-box;background:#272C36;border-right:1px solid #3B4252;display:flex;flex-direction:column;padding:20px 12px;gap:20px;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:14px;color:#D8DEE9">
  <div style="display:flex;align-items:center;gap:10px;padding:0 10px">
    <div style="width:28px;height:28px;border-radius:7px;background:#88C0D0;display:flex;align-items:center;justify-content:center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E3440" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18v12H3zM7.5 10h.01M12 10h.01M16.5 10h.01M7.5 14h.01M12 14h.01M16.5 14h.01"></path></svg>
    </div>
    <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px;letter-spacing:-0.01em;color:#ECEFF4">Marquee</span>
  </div>

  <nav aria-label="Main" style="display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{main}}" as="n" hint-placeholder-count="6">
      <a href="#" style="display:flex;align-items:center;gap:12px;height:38px;padding:0 10px;border-radius:8px;text-decoration:none;background:{{n.bg}};color:{{n.fg}};font-weight:{{n.weight}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{n.fg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>
        <span style="flex-grow:1">{{n.label}}</span>
        <span style="font-size:12px;color:#98A3B8">{{n.count}}</span>
      </a>
    </sc-for>
  </nav>

  <div style="height:1px;background:#3B4252;margin:0 10px"></div>

  <nav aria-label="Library" style="display:flex;flex-direction:column;gap:2px">
    <div style="padding:0 10px 6px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#98A3B8">Library</div>
    <sc-for list="{{lib}}" as="n" hint-placeholder-count="3">
      <a href="#" style="display:flex;align-items:center;gap:12px;height:38px;padding:0 10px;border-radius:8px;text-decoration:none;background:{{n.bg}};color:{{n.fg}};font-weight:{{n.weight}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{n.fg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>
        <span style="flex-grow:1">{{n.label}}</span>
        <span style="font-size:12px;color:#98A3B8">{{n.count}}</span>
      </a>
    </sc-for>
  </nav>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:2px">
    <a href="#" style="display:flex;align-items:center;gap:12px;height:38px;padding:0 10px;border-radius:8px;text-decoration:none;color:#D8DEE9">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D8DEE9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
      <span>Export JSON</span>
    </a>
    <a href="#" style="display:flex;align-items:center;gap:12px;height:38px;padding:0 10px;border-radius:8px;text-decoration:none;color:#D8DEE9">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D8DEE9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9c.6.5 1.3.9 2 1.2l.4 2.6h4l.4-2.6c.7-.3 1.4-.7 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"></path></svg>
      <span>Settings</span>
    </a>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":null,"default":"Home"},"h":{"editor":null,"default":1240},"$preview":{"width":232,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Home';
    const h = this.props.h ?? 1240;
    const mk = (label, count, d) => {
      const on = label === active;
      return { label, count, d, bg: on ? '#3B4252' : 'transparent', fg: on ? '#88C0D0' : '#D8DEE9', weight: on ? 600 : 400 };
    };
    const main = [
      mk('Home', '', 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'),
      mk('Diary', '412', 'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11'),
      mk('Watchlist', '38', 'M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z'),
      mk('On Ice', '6', 'M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9'),
      mk('People', '', 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.3a3.5 3.5 0 0 1 0 6.4M18 14.3c2 .7 3.5 2.4 3.5 5.7'),
      mk('Recap', '', 'M5 20V11M12 20V4M19 20v-6')
    ];
    const lib = [
      mk('Movies', '231', 'M4 5h16v14H4zM8 5v14M16 5v14M4 9h4M4 15h4M16 9h4M16 15h4'),
      mk('TV', '94', 'M4 7h16v11H4zM9 3l3 4 3-4'),
      mk('Anime', '87', 'M12 3l2.2 6.3L21 12l-6.8 2.7L12 21l-2.2-6.3L3 12l6.8-2.7z'),
      mk('Theaters', '7', 'M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4zM14 7v2M14 11v2M14 15v2')
    ];
    return { main, lib, hpx: h + 'px' };
  }
}
</script>
</body>
</html>
