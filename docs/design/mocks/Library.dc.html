<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#2E3440}
button,a{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #88C0D0;outline-offset:2px}
</style>
</helmet>
<div style="width:1440px;height:1240px;box-sizing:border-box;display:flex;background:#2E3440;color:#E5E9F0;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums;overflow:hidden">
  <div style="width:232px;flex-shrink:0"><dc-import name="Sidebar" active="Movies" h="1240" hint-size="232px,1240px"></dc-import></div>
  <main style="flex-grow:1;min-width:0;display:flex;flex-direction:column">
    <div style="width:1208px;height:72px;flex-shrink:0"><dc-import name="Topbar" hint-size="1208px,72px"></dc-import></div>

    <div style="padding:28px 32px 32px;display:flex;flex-direction:column;gap:22px">

      <div style="display:flex;align-items:flex-end;gap:20px">
        <div style="display:flex;flex-direction:column;gap:4px">
          <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#98A3B8">231 films watched</span>
          <h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:40px;line-height:1;letter-spacing:-0.02em;color:#ECEFF4">Movies</h1>
        </div>
        <div style="flex-grow:1"></div>
        <div style="display:flex;gap:4px;padding:3px;border-radius:9px;background:#3B4252">
          <button type="button" style="height:28px;padding:0 12px;border:0;border-radius:6px;background:#5E81AC;color:#ECEFF4;font-weight:600;font-size:12px;cursor:pointer">Posters</button>
          <button type="button" style="height:28px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:#B8C2D4;font-size:12px;cursor:pointer">List</button>
        </div>
      </div>

      <!-- Filters -->
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
          <button type="button" style="display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:9px;border:1px solid {{f.bc}};background:{{f.bg}};color:#ECEFF4;font-size:13px;cursor:pointer">
            <span style="color:#98A3B8">{{f.k}}</span>
            <span style="font-weight:600">{{f.v}}</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#98A3B8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
        </sc-for>
        <div style="flex-grow:1"></div>
        <button type="button" style="height:34px;padding:0 12px;border:0;background:transparent;color:#88C0D0;font-size:13px;cursor:pointer">Clear filters</button>
      </div>

      <!-- Grid -->
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:20px 16px">
        <sc-for list="{{films}}" as="f" hint-placeholder-count="21">
          <div style="display:flex;flex-direction:column;gap:7px;min-width:0">
            <div style="position:relative;aspect-ratio:2/3;border-radius:7px;background:{{f.bg}};display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;box-shadow:0 6px 18px rgba(0,0,0,0.28)">
              <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:13px;line-height:1.12;color:#ECEFF4">{{f.t}}</span>
              <sc-if value="{{f.theater}}" hint-placeholder-val="{{ false }}">
                <span style="position:absolute;top:8px;left:8px;font-size:10px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:rgba(46,52,64,0.85);color:#88C0D0">Theater</span>
              </sc-if>
            </div>
            <div style="display:flex;align-items:center;gap:6px;min-width:0">
              <span style="flex-grow:1;min-width:0;font-size:13px;font-weight:600;color:#ECEFF4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{f.t}}</span>
              <span style="display:flex;align-items:center;gap:3px;font-size:12px;color:#EBCB8B">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="#EBCB8B" aria-hidden="true"><path d="M12 3l2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 16.9 6.4 20l1.3-6.2L3 9.5l6.3-.7z"></path></svg>{{f.r}}
              </span>
            </div>
            <span style="font-size:12px;color:#98A3B8;margin-top:-4px">{{f.y}} · {{f.d}}</span>
          </div>
        </sc-for>
      </div>

      <div style="display:flex;align-items:center;justify-content:center;gap:12px;color:#98A3B8;font-size:13px">
        <span>Showing 21 of 231</span>
        <button type="button" style="height:34px;padding:0 16px;border:1px solid #4C566A;border-radius:9px;background:transparent;color:#E5E9F0;font-size:13px;cursor:pointer">Show more</button>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const F = (k, v, on) => ({ k, v, bc: on ? '#88C0D0' : '#434C5E', bg: on ? 'rgba(136,192,208,0.12)' : '#3B4252' });
    const filters = [
      F('Sort', 'Date watched', false),
      F('Decade', 'Any', false),
      F('Genre', 'Any', false),
      F('Rating', '4.0 and up', true),
      F('Seen', 'Anywhere', false),
      F('Director', 'Any', false)
    ];
    const cols = ['#81A1C1','#B48EAD','#88C0D0','#D08770','#A3BE8C','#EBCB8B','#8FBCBB','#BF616A','#5E81AC'];
    const grad = (i) => 'linear-gradient(160deg,' + cols[i % cols.length] + ' 0%,#2E3440 100%)';
    const data = [
      ['Heat','1995','4.5','170 min',true],
      ['Paprika','2006','5.0','90 min',true],
      ['Past Lives','2023','4.0','106 min',true],
      ['Perfect Blue','1997','4.5','81 min',false],
      ['Alien','1979','4.5','117 min',true],
      ['The Holdovers','2023','4.0','133 min',false],
      ['Collateral','2004','4.0','120 min',true],
      ['Manhunter','1986','4.0','120 min',false],
      ['Stalker','1979','4.5','162 min',true],
      ['Seven Samurai','1954','5.0','207 min',true],
      ['Spirited Away','2001','5.0','125 min',true],
      ['The Insider','1999','4.0','157 min',false],
      ['Blade Runner','1982','4.5','117 min',false],
      ['Tokyo Godfathers','2003','4.0','92 min',false],
      ['The Last of the Mohicans','1992','4.0','112 min',false],
      ['Millennium Actress','2001','4.5','87 min',false],
      ['Ikiru','1952','4.5','143 min',true],
      ['Ran','1985','4.5','162 min',true],
      ['Mad Max: Fury Road','2015','4.0','120 min',true],
      ['Akira','1988','4.5','124 min',false],
      ['Rear Window','1954','4.5','112 min',false]
    ];
    const films = data.map(([t, y, r, d, theater], i) => ({ t, y, r, d, theater, bg: grad(i) }));
    return { filters, films };
  }
}
</script>
</body>
</html>
