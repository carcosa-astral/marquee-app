<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#2E3440}
button,a{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #88C0D0;outline-offset:2px}
</style>
</helmet>
<div style="width:1440px;height:1240px;box-sizing:border-box;display:flex;background:#2E3440;color:#E5E9F0;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums;overflow:hidden">
  <div style="width:232px;flex-shrink:0"><dc-import name="Sidebar" active="Diary" h="1240" hint-size="232px,1240px"></dc-import></div>
  <main style="flex-grow:1;min-width:0;display:flex;flex-direction:column">
    <div style="width:1208px;height:72px;flex-shrink:0"><dc-import name="Topbar" hint-size="1208px,72px"></dc-import></div>

    <div style="padding:28px 32px 32px;display:flex;flex-direction:column;gap:22px">

      <div style="display:flex;align-items:flex-end;gap:20px">
        <div style="display:flex;flex-direction:column;gap:4px">
          <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#98A3B8">412 entries all time</span>
          <h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:40px;line-height:1;letter-spacing:-0.02em;color:#ECEFF4">Diary</h1>
        </div>
        <div style="flex-grow:1"></div>
        <div style="display:flex;align-items:center;gap:6px;height:40px;padding:0 6px;border-radius:10px;background:#3B4252">
          <button type="button" aria-label="Previous year" style="width:30px;height:30px;border:0;border-radius:7px;background:transparent;color:#D8DEE9;cursor:pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D8DEE9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
          </button>
          <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;min-width:48px;text-align:center;color:#ECEFF4">2026</span>
          <button type="button" aria-label="Next year" style="width:30px;height:30px;border:0;border-radius:7px;background:transparent;color:#D8DEE9;cursor:pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#98A3B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:10px">
        <div style="display:flex;gap:6px">
          <button type="button" style="height:30px;padding:0 12px;border-radius:999px;border:0;background:#4C566A;color:#ECEFF4;font-size:12px;font-weight:600;cursor:pointer">All</button>
          <button type="button" style="height:30px;padding:0 12px;border-radius:999px;border:1px solid #434C5E;background:transparent;color:#B8C2D4;font-size:12px;cursor:pointer">Movies</button>
          <button type="button" style="height:30px;padding:0 12px;border-radius:999px;border:1px solid #434C5E;background:transparent;color:#B8C2D4;font-size:12px;cursor:pointer">TV</button>
          <button type="button" style="height:30px;padding:0 12px;border-radius:999px;border:1px solid #434C5E;background:transparent;color:#B8C2D4;font-size:12px;cursor:pointer">Anime</button>
        </div>
        <div style="width:1px;height:20px;background:#434C5E"></div>
        <div style="display:flex;gap:6px">
          <button type="button" style="height:30px;padding:0 12px;border-radius:999px;border:1px solid #434C5E;background:transparent;color:#B8C2D4;font-size:12px;cursor:pointer">Theater only</button>
          <button type="button" style="height:30px;padding:0 12px;border-radius:999px;border:1px solid #434C5E;background:transparent;color:#B8C2D4;font-size:12px;cursor:pointer">Rewatches</button>
          <button type="button" style="height:30px;padding:0 12px;border-radius:999px;border:1px solid #434C5E;background:transparent;color:#B8C2D4;font-size:12px;cursor:pointer">Has a note</button>
        </div>
        <div style="flex-grow:1"></div>
        <div style="display:flex;gap:4px;padding:3px;border-radius:9px;background:#3B4252">
          <button type="button" style="height:28px;padding:0 12px;border:0;border-radius:6px;background:#5E81AC;color:#ECEFF4;font-weight:600;font-size:12px;cursor:pointer">List</button>
          <button type="button" style="height:28px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:#B8C2D4;font-size:12px;cursor:pointer">Posters</button>
        </div>
      </div>

      <!-- Header row -->
      <div style="display:flex;align-items:center;gap:16px;padding:0 12px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#98A3B8">
        <span style="width:44px">Day</span>
        <span style="width:36px"></span>
        <span style="flex-grow:1">Title</span>
        <span style="width:96px">Type</span>
        <span style="width:230px">Where</span>
        <span style="width:60px;text-align:right">Rating</span>
        <span style="width:250px">Note</span>
      </div>

      <div style="display:flex;flex-direction:column;margin-top:-10px">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="14">
          <div>
            <sc-if value="{{r.isHeader}}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;align-items:baseline;gap:12px;height:44px;padding:14px 12px 0;box-sizing:border-box">
                <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px;color:#ECEFF4">{{r.label}}</span>
                <span style="font-size:13px;color:#98A3B8">{{r.sub}}</span>
              </div>
            </sc-if>
            <sc-if value="{{r.isRow}}" hint-placeholder-val="{{ true }}">
              <a href="#" style="display:flex;align-items:center;gap:16px;height:60px;padding:0 12px;box-sizing:border-box;border-top:1px solid #3B4252;text-decoration:none;color:inherit">
                <span style="width:44px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;color:#88C0D0">{{r.day}}</span>
                <div style="width:36px;height:52px;flex-shrink:0;border-radius:4px;background:{{r.bg}}"></div>
                <div style="flex-grow:1;min-width:0;display:flex;align-items:baseline;gap:8px">
                  <span style="font-weight:600;color:#ECEFF4;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.t}}</span>
                  <span style="font-size:13px;color:#98A3B8">{{r.y}}</span>
                  <sc-if value="{{r.rewatch}}" hint-placeholder-val="{{ false }}">
                    <span style="font-size:10px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:rgba(235,203,139,0.16);color:#EBCB8B">Rewatch</span>
                  </sc-if>
                </div>
                <span style="width:96px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:{{r.kbg}};color:{{r.kfg}}">{{r.k}}</span></span>
                <div style="width:230px;display:flex;flex-direction:column;min-width:0">
                  <span style="color:#E5E9F0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.where}}</span>
                  <span style="font-size:12px;color:#98A3B8">{{r.detail}}</span>
                </div>
                <span style="width:60px;text-align:right;font-size:14px;color:#EBCB8B">{{r.rating}}</span>
                <span style="width:250px;font-size:13px;color:#B8C2D4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.note}}</span>
              </a>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const grad = (a) => 'linear-gradient(160deg,' + a + ',#2E3440)';
    const K = {
      Movie: { kbg: 'rgba(129,161,193,0.18)', kfg: '#81A1C1' },
      TV: { kbg: 'rgba(180,142,173,0.2)', kfg: '#B48EAD' },
      Anime: { kbg: 'rgba(235,203,139,0.16)', kfg: '#EBCB8B' }
    };
    const H = (label, sub) => ({ isHeader: true, isRow: false, label, sub });
    const R = (day, t, y, k, col, where, detail, rating, note, rewatch) => ({
      isHeader: false, isRow: true, day, t, y, k, ...K[k], bg: grad(col), where, detail, rating: rating || '', note: note || '', rewatch: !!rewatch
    });
    const rows = [
      H('October 2026', '9 entries'),
      R('24', 'Heat', '1995', 'Movie', '#D08770', 'The Grand Palace', 'Screen 4 · 35mm · with Sam', '4.5', 'Film print for the 30th anniversary.', true),
      R('21', 'Frieren: Beyond Journey\'s End', 'Ep 17', 'Anime', '#8FBCBB', 'Home', 'Plex', '', '', false),
      R('19', 'Past Lives', '2023', 'Movie', '#88C0D0', 'Rialto Repertory', 'Standard · alone', '4.0', 'Quiet and devastating.', false),
      R('17', 'Perfect Blue', '1997', 'Anime', '#B48EAD', 'Home', 'Plex', '4.5', 'Still unsettling.', false),
      R('12', 'Paprika', '2006', 'Anime', '#EBCB8B', 'Lakeside Cinema', 'Screen 2 · Standard · with Sam', '5.0', 'Saw it on a big screen at last.', false),
      R('09', 'Slow Horses', 'S3 E4', 'TV', '#5E81AC', 'Home', 'Apple TV', '', '', false),
      R('04', 'Alien', '1979', 'Movie', '#A3BE8C', 'The Grand Palace', 'Screen 1 · Standard · alone', '4.5', 'Better every time.', true),
      H('September 2026', '5 entries'),
      R('28', 'The Holdovers', '2023', 'Movie', '#BF616A', 'Home', 'Plex', '4.0', '', false),
      R('21', 'Cowboy Bebop', 'Finished', 'Anime', '#81A1C1', 'Home', 'Plex', '5.0', 'Series finale. No notes.', false),
      R('14', 'Station Eleven', 'Finished', 'TV', '#8FBCBB', 'Home', 'Max', '4.0', '', false),
      R('07', 'Collateral', '2004', 'Movie', '#5E81AC', 'Northgate 12', 'Screen 9 · Standard · with Sam', '4.0', '', false),
      R('02', 'Manhunter', '1986', 'Movie', '#D08770', 'Home', 'Disc', '4.0', 'Part of working through Mann.', false)
    ];
    return { rows };
  }
}
</script>
</body>
</html>
