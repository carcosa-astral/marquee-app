<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>On Ice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#2E3440}
button,a{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #88C0D0;outline-offset:2px}
</style>
</helmet>
<div style="width:1440px;height:1240px;box-sizing:border-box;display:flex;background:#2E3440;color:#E5E9F0;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums;overflow:hidden">
  <div style="width:232px;flex-shrink:0"><dc-import name="Sidebar" active="On Ice" h="1240" hint-size="232px,1240px"></dc-import></div>
  <main style="flex-grow:1;min-width:0;display:flex;flex-direction:column">
    <div style="width:1208px;height:72px;flex-shrink:0"><dc-import name="Topbar" hint-size="1208px,72px"></dc-import></div>

    <div style="padding:28px 32px 32px;display:flex;flex-direction:column;gap:24px">

      <div style="display:flex;align-items:flex-end;gap:20px">
        <div style="display:flex;flex-direction:column;gap:4px">
          <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#98A3B8">6 shows set aside</span>
          <h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:40px;line-height:1;letter-spacing:-0.02em;color:#ECEFF4">On Ice</h1>
        </div>
        <p style="margin:0 0 4px;max-width:420px;font-size:13px;color:#A9B3C5">Anything you paused or gave up on. Marquee keeps your place and your reason so you can pick it up later or let it go.</p>
        <div style="flex-grow:1"></div>
        <div style="display:flex;gap:6px">
          <button type="button" style="height:30px;padding:0 12px;border-radius:999px;border:0;background:#4C566A;color:#ECEFF4;font-size:12px;font-weight:600;cursor:pointer">All 6</button>
          <button type="button" style="height:30px;padding:0 12px;border-radius:999px;border:1px solid #434C5E;background:transparent;color:#B8C2D4;font-size:12px;cursor:pointer">Paused 3</button>
          <button type="button" style="height:30px;padding:0 12px;border-radius:999px;border:1px solid #434C5E;background:transparent;color:#B8C2D4;font-size:12px;cursor:pointer">Dropped 3</button>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px">
        <sc-for list="{{items}}" as="i" hint-placeholder-count="6">
          <article style="display:flex;gap:20px;padding:18px;border-radius:14px;border:1px solid #434C5E;background:#343A47;min-width:0">
            <div style="width:96px;height:144px;flex-shrink:0;border-radius:7px;background:{{i.bg}};display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;box-shadow:0 6px 18px rgba(0,0,0,0.28)">
              <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12px;line-height:1.12;color:#ECEFF4">{{i.t}}</span>
            </div>
            <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:10px">
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:{{i.kbg}};color:{{i.kfg}}">{{i.k}}</span>
                <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:{{i.sbg}};color:{{i.sfg}}">{{i.state}}</span>
              </div>
              <h2 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;line-height:1.1;color:#ECEFF4">{{i.t}}</h2>
              <div style="display:flex;flex-direction:column;gap:6px">
                <div style="display:flex;justify-content:space-between;font-size:12px;color:#A9B3C5">
                  <span>Stopped at {{i.at}}</span>
                  <span>{{i.pct}}</span>
                </div>
                <div style="height:5px;border-radius:999px;background:#434C5E;overflow:hidden"><div style="width:{{i.pct}};height:100%;background:{{i.sfg}}"></div></div>
              </div>
              <p style="margin:0;font-size:13px;color:#D8DEE9">{{i.why}}</p>
              <span style="font-size:12px;color:#98A3B8">Iced {{i.when}}</span>
              <div style="display:flex;gap:8px;margin-top:auto">
                <button type="button" style="height:32px;padding:0 14px;border:0;border-radius:8px;background:#88C0D0;color:#2E3440;font-weight:600;font-size:13px;cursor:pointer">Resume</button>
                <button type="button" style="height:32px;padding:0 12px;border:1px solid #4C566A;border-radius:8px;background:transparent;color:#E5E9F0;font-size:13px;cursor:pointer">{{i.alt}}</button>
              </div>
            </div>
          </article>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const grad = (a) => 'linear-gradient(160deg,' + a + ' 0%,#2E3440 100%)';
    const K = {
      TV: { kbg: 'rgba(180,142,173,0.2)', kfg: '#B48EAD' },
      Anime: { kbg: 'rgba(235,203,139,0.16)', kfg: '#EBCB8B' }
    };
    const P = { sbg: 'rgba(129,161,193,0.18)', sfg: '#81A1C1', alt: 'Move to dropped' };
    const D = { sbg: 'rgba(208,135,112,0.18)', sfg: '#D08770', alt: 'Move to paused' };
    const items = [
      { t: 'The Wire', k: 'TV', ...K.TV, state: 'Paused', ...P, at: 'S2 E3', pct: '25%', why: 'Needed a break. Want to come back to it.', when: 'Aug 14, 2026 · 71 days ago', bg: grad('#81A1C1') },
      { t: 'Bleach', k: 'Anime', ...K.Anime, state: 'Dropped', ...D, at: 'Ep 64 of 366', pct: '17%', why: 'The filler arc dragged on too long.', when: 'Jun 2, 2026 · 144 days ago', bg: grad('#D08770') },
      { t: 'Westworld', k: 'TV', ...K.TV, state: 'Dropped', ...D, at: 'S3 E2', pct: '61%', why: 'Lost the plot, stopped caring.', when: 'Mar 19, 2026 · 220 days ago', bg: grad('#EBCB8B') },
      { t: 'Naruto Shippuden', k: 'Anime', ...K.Anime, state: 'Paused', ...P, at: 'Ep 140 of 500', pct: '28%', why: 'Planning to skip the filler when I return.', when: 'Feb 8, 2026 · 258 days ago', bg: grad('#A3BE8C') },
      { t: 'Lost', k: 'TV', ...K.TV, state: 'Dropped', ...D, at: 'S4 E5', pct: '64%', why: 'Stopped caring about the mystery.', when: 'Nov 30, 2025 · 328 days ago', bg: grad('#8FBCBB') },
      { t: 'Fullmetal Alchemist: Brotherhood', k: 'Anime', ...K.Anime, state: 'Paused', ...P, at: 'Ep 30 of 64', pct: '47%', why: 'Will pick it back up this winter.', when: 'Oct 3, 2025 · 386 days ago', bg: grad('#BF616A') }
    ];
    return { items };
  }
}
</script>
</body>
</html>
