<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#2E3440}
button:focus-visible,input:focus-visible{outline:2px solid #88C0D0;outline-offset:2px}
</style>
</helmet>
<header style="width:1208px;height:72px;box-sizing:border-box;padding:0 32px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #3B4252;background:#2E3440;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:14px;color:#E5E9F0">
  <label for="search" style="position:relative;display:flex;align-items:center;width:420px">
    <svg style="position:absolute;left:14px" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#98A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-4.3-4.3"></path></svg>
    <input id="search" type="text" placeholder="Search titles, people, your notes" style="width:100%;box-sizing:border-box;height:40px;padding:0 60px 0 40px;border-radius:10px;border:1px solid #434C5E;background:#3B4252;color:#ECEFF4;font:inherit;font-size:14px">
    <span style="position:absolute;right:12px;font-size:12px;color:#98A3B8;border:1px solid #4C566A;border-radius:5px;padding:1px 6px">Ctrl K</span>
  </label>
  <div style="flex-grow:1"></div>
  <span style="font-size:12px;color:#EBCB8B;border:1px solid #5b5440;border-radius:999px;padding:3px 10px">Sample data</span>
  <button type="button" style="display:flex;align-items:center;gap:8px;height:40px;padding:0 18px;border:0;border-radius:10px;background:#88C0D0;color:#2E3440;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E3440" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    Log a watch
  </button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1208,"height":72}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
